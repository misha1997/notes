server {
    listen 80;
    server_name _;

    # 10МБ лимит загрузки + запас
    client_max_body_size 12m;

    # Gzip сжатие для ускорения отдачи текста, скриптов, стилей и JSON
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Общие proxy-заголовки для бэкенда
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API → бэкенд
    location /api/ {
        proxy_pass http://backend:3001;
    }

    # WebSocket → бэкенд
    location /ws {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Скачивание вложений (бэкенд отдаёт X-Accel-Redirect на /protected-uploads/)
    location /download/ {
        proxy_pass http://backend:3001;
    }

    # Статика загрузок (на всякий случай)
    location /uploads/ {
        proxy_pass http://backend:3001;
    }

    # Внутренняя location для отдачи файлов через X-Accel-Redirect.
    # Файлы лежат в общем volume, смонтированном сюда только-чтение.
    location /protected-uploads/ {
        internal;
        alias /usr/share/nginx/uploads/;
        expires 30d;
        add_header Cache-Control "private, max-age=2592000, immutable";
    }

    # Кэширование версионированной статики сборки (CRA /static/js, /static/css, /static/media)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html не должен кэшироваться вечно, чтобы релизы применялись мгновенно
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
server {
    listen 80;
    server_name _;

    # 10МБ лимит загрузки + запас
    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    # Общие proxy-заголовки для бэкенда
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API → бэкенд
    location /api/ {
        proxy_pass http://backend:3001;
    }

    # Скачивание вложений (бэкенд отдаёт X-Accel-Redirect на /protected-uploads/)
    location /download/ {
        proxy_pass http://backend:3001;
    }

    # Статика загрузок (на всякий случай)
    location /uploads/ {
        proxy_pass http://backend:3001;
    }

    # Внутренняя location для отдачи файлов через X-Accel-Redirect.
    # Файлы лежат в общем volume, смонтированном сюда только-чтение.
    location /protected-uploads/ {
        internal;
        alias /usr/share/nginx/uploads/;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}